# Integrazione continua: ogni push e ogni pull request verso main devono
# superare formattazione, lint, typecheck, test, build, controllo delle
# migrazioni e audit delle dipendenze. Con la protezione del branch attiva,
# il merge è bloccato finché questo workflow non è verde.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Il workflow legge solo il codice: nessun permesso di scrittura sul repository.
permissions:
  contents: read

# Un nuovo push sulla stessa PR annulla l'esecuzione precedente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installa le dipendenze (lockfile bloccato)
        run: pnpm install --frozen-lockfile

      - name: Formattazione
        run: pnpm format:check

      - name: Stato della documentazione allineato a docs/status.json
        run: pnpm docs:status:check

      - name: Lint, typecheck, test e build
        run: pnpm turbo run lint typecheck test build

      # Il feed sul telefono (M3): Chromium con le viste di iPhone 13 e Pixel 7,
      # sul banco di prova costruito dalla build appena fatta (apps/web/e2e).
      - name: Installa Chromium per Playwright
        run: pnpm --filter @epicfeed/web exec playwright install --with-deps chromium

      - name: Test del feed su viste mobili (Playwright)
        run: pnpm --filter @epicfeed/web test:e2e

      # Budget di Lighthouse sul telefono (LCP, TBT, CLS) sulla build appena fatta.
      - name: Budget Lighthouse (mobile)
        run: pnpm --filter @epicfeed/web perf

      - name: Migrazioni allineate allo schema
        run: pnpm --filter @epicfeed/db db:check

  audit:
    name: Audit delle dipendenze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 attiva da solo la cache di pnpm (campo packageManager),
          # ma questo job non installa nulla: senza store la cache fallirebbe.
          package-manager-cache: false

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate
